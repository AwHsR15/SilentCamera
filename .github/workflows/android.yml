name: Android verification and preview artifacts
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - name: Verify and package preview
        run: bash tools/build-release.sh
      - uses: actions/upload-artifact@v4
        with:
          name: SilentCamera-2.0-preview
          path: |
            release/SilentCamera-v2.0-*
            release/manifest.json
            release/SHA256SUMS
          if-no-files-found: error
